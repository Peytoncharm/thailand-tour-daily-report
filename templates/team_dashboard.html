<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>P&amp;C Transfer — Live Board</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0b0d12; --panel: #101320; --panel2: #0d0f16;
    --text: #e6e8ef; --muted: #98a0b8;
    --green: #2dd4a0; --amber: #f0b429; --red: #f06060; --grey: #5a6072;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  /* Dark board: mute the OSM tiles instead of paying for dark tiles */
  .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg)
                          saturate(0.3) brightness(0.7); }
  #topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: linear-gradient(180deg, #101320, rgba(11,13,18,0.85));
    padding: 10px 16px; display: flex; align-items: baseline; gap: 14px;
    border-bottom: 1px solid #1d2233; }
  #topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: .4px; }
  #topbar .sub { color: var(--muted); font-size: 12px; }
  #legend { position: absolute; bottom: 14px; left: 14px; z-index: 1000;
    background: var(--panel2); border: 1px solid #1d2233; border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: var(--muted); }
  .dotk { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text);
    border-radius: 10px; border: 1px solid #1d2233; }
  .leaflet-popup-tip { background: var(--panel); }
  .pop b { font-size: 14px; }
  .pop .m { color: var(--muted); font-size: 12px; line-height: 1.7; }
  #stamp { position: absolute; bottom: 14px; right: 14px; z-index: 1000;
    color: var(--muted); font-size: 11px; background: var(--panel2);
    border: 1px solid #1d2233; border-radius: 8px; padding: 6px 10px; }
  /* Slice 2 */
  #filters { position: absolute; top: 48px; left: 14px; z-index: 1000;
    background: var(--panel2); border: 1px solid #1d2233; border-radius: 10px;
    padding: 8px 10px; font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .fbtn { background: var(--panel); color: var(--muted); border: 1px solid #1d2233;
    border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .fbtn.on { color: var(--text); border-color: #3a4468; background: #1a1f33; }
  .bpin { border-radius: 4px; border: 2px solid; width: 14px; height: 14px;
    transform: rotate(45deg); box-shadow: 0 0 6px rgba(0,0,0,.6); }
  #nocoords { position: absolute; top: 48px; right: 14px; z-index: 1000;
    background: var(--panel2); border: 1px solid #1d2233; border-radius: 10px;
    padding: 8px 12px; font-size: 12px; max-width: 260px; max-height: 45vh;
    overflow-y: auto; }
  #nocoords h3 { font-size: 12px; color: var(--muted); font-weight: 600;
    margin-bottom: 6px; }
  #nocoords .row { border-top: 1px solid #1d2233; padding: 5px 0;
    color: var(--text); }
  #nocoords .row .m { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <h1>🚐 P&amp;C Transfer — {% if demo %}DEMO Board{% else %}Live Board{% endif %}</h1>
  <span class="sub" id="count">…</span>
  {% if demo %}<span style="background:#f0b429;color:#0b0d12;font-weight:700;
    border-radius:6px;padding:2px 10px;font-size:12px;letter-spacing:.5px">
    DEMO — ข้อมูลจำลอง ไม่ใช่ข้อมูลจริง</span>{% endif %}
  <a id="boardlink" href="#" style="color:#4da3ff;font-size:12px;text-decoration:none">📋 รายการงาน</a>
  <script>document.currentScript.previousElementSibling.href =
    "/team/board?key=" + encodeURIComponent({{ key|tojson }}) +
    ({{ 'true' if demo else 'false' }} ? "&demo=1" : "");</script>
</div>
<div id="legend">
  <div><span class="dotk" style="background:var(--green)"></span> สดใหม่ &lt; 5 นาที</div>
  <div><span class="dotk" style="background:var(--amber)"></span> 5–20 นาที</div>
  <div><span class="dotk" style="background:var(--red)"></span> เกิน 20 นาที / ขาดสัญญาณ</div>
</div>
<div id="stamp">—</div>
<div id="filters">
  <button class="fbtn on" data-f="drivers">คนขับ</button>
  <button class="fbtn on" data-f="bookings">งาน</button>
  <button class="fbtn on" data-f="confirmed">Confirmed</button>
  <button class="fbtn on" data-f="other">สถานะอื่น</button>
  <button class="fbtn on" data-f="transfer">Transfer</button>
  <!-- BU separation (Orathai, 11 Aug): Tour layer ships default-OFF —
       at high-season volume the mixed view drowns; the chip re-enables it -->
  <button class="fbtn" data-f="tour">Tour</button>
</div>
<div id="nocoords" style="display:none">
  <h3>งานที่ยังไม่มีพิกัด (แสดงบนแผนที่ไม่ได้)</h3>
  <div id="nclist"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const KEY = {{ key|tojson }};
  const DEMO = {{ 'true' if demo else 'false' }};

  // Contact fast path (11 Aug): the incident moment is "driver silent,
  // customer landing, call NOW" — tap-to-call beats any deep link.
  // Numbers come from the cached payload / provider registry (read-only).
  // DEMO: fake numbers render as plain text, links disabled.
  function contactHtml(label, phone) {
    if (!phone) return "";
    if (DEMO) return `<br>${label}: ${phone}`;
    const digits = String(phone).replace(/[^\d+]/g, "");
    const intl = digits.startsWith("+") ? digits.slice(1)
               : digits.startsWith("0") ? "66" + digits.slice(1) : digits;
    return `<br>${label}: <a href="tel:+${intl}" style="color:#4da3ff;text-decoration:none">📞 ${phone}</a>` +
           `&nbsp;·&nbsp;<a href="https://wa.me/${intl}" target="_blank" rel="noopener" style="color:#2dd4a0;text-decoration:none">💬 WhatsApp</a>`;
  }
  const REFRESH_MS = 30000;

  // East region: Koh Chang / Trat with the mainland corridor in view
  const map = L.map("map", { zoomControl: true }).setView([12.35, 102.15], 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  const markers = new Map();   // driver code -> circleMarker
  const bmarkers = new Map();  // booking_id -> marker
  const F = { drivers: true, bookings: true, confirmed: true, other: true,
              transfer: true, tour: false };  // Tour default-off (BU separation)
  document.querySelectorAll(".fbtn").forEach(b => b.addEventListener("click", () => {
    F[b.dataset.f] = !F[b.dataset.f];
    b.classList.toggle("on", F[b.dataset.f]);
    refresh();
  }));

  function bookingVisible(bk) {
    if (!F.bookings) return false;
    const conf = (bk.status || "").toLowerCase() === "confirmed";
    if (conf && !F.confirmed) return false;
    if (!conf && !F.other) return false;
    const isTransfer = (bk.type || "").toLowerCase().includes("transfer");
    if (isTransfer && !F.transfer) return false;
    if (!isTransfer && !F.tour) return false;
    return true;
  }

  function bookingColour(bk) {
    return (bk.status || "").toLowerCase() === "confirmed"
      ? "#4da3ff" : getComputedStyle(document.documentElement).getPropertyValue("--grey").trim();
  }

  function colourFor(age_s, t) {
    if (age_s == null) return getComputedStyle(document.documentElement).getPropertyValue("--grey");
    if (age_s < t.green_s) return getComputedStyle(document.documentElement).getPropertyValue("--green");
    if (age_s < t.amber_s) return getComputedStyle(document.documentElement).getPropertyValue("--amber");
    return getComputedStyle(document.documentElement).getPropertyValue("--red");
  }

  function ageLabel(age_s) {
    if (age_s == null) return "ไม่ทราบ";
    if (age_s < 60) return age_s + " วิที่แล้ว";
    if (age_s < 3600) return Math.round(age_s / 60) + " นาทีที่แล้ว";
    return Math.round(age_s / 3600) + " ชม.ที่แล้ว";
  }

  async function refresh() {
    try {
      const r = await fetch("/team/dashboard/data?key=" + encodeURIComponent(KEY)
                            + (DEMO ? "&demo=1" : ""));
      const d = await r.json();
      if (!d.ok) { document.getElementById("count").textContent = "⚠ " + (d.reason || "error"); return; }
      const seen = new Set();
      for (const drv of d.drivers) {
        if (drv.lat == null || drv.lng == null) continue;
        seen.add(drv.code);
        const col = colourFor(drv.age_s, d.thresholds).trim();
        const html = `<div class="pop"><b>${drv.name || drv.code}</b>
          <div class="m">รหัส: ${drv.code}<br>
          เห็นล่าสุด: ${drv.last_seen_ict || "-"} (${ageLabel(drv.age_s)})<br>
          แบตเตอรี่: ${drv.batt != null ? drv.batt + "%" : "-"}${contactHtml("โทร", drv.phone)}</div></div>`;
        if (markers.has(drv.code)) {
          const m = markers.get(drv.code);
          m.setLatLng([drv.lat, drv.lng]);
          m.setStyle({ color: col, fillColor: col });
          m.getPopup().setContent(html);
        } else {
          const m = L.circleMarker([drv.lat, drv.lng], {
            radius: 9, weight: 2, color: col, fillColor: col, fillOpacity: 0.75
          }).addTo(map).bindPopup(html);
          markers.set(drv.code, m);
        }
      }
      for (const [code, m] of markers) {
        if (!seen.has(code) || !F.drivers) { map.removeLayer(m); markers.delete(code); }
      }

      // ── Slice 2: booking pins + no-coords list ──
      const bseen = new Set();
      const nc = [];
      for (const bk of (d.bookings || [])) {
        if (bk.lat == null || bk.lng == null) {
          if (bookingVisible(bk)) nc.push(bk);
          continue;
        }
        if (!bookingVisible(bk)) continue;
        bseen.add(bk.booking_id);
        const col = bookingColour(bk);
        // Partner-operated (Join Transfer + all Tours): hollow diamond,
        // no GPS expectation — product decision 11 Aug. Only Private
        // Transfer keeps the solid fill (our own tracking applies).
        const isPartner = ((bk.type || "").toLowerCase() !== "private transfer");
        const fill = isPartner ? "transparent" : `${col}33`;
        const pinHtml = `<div class="bpin" style="border-color:${col};background:${fill}"></div>`;
        const html = `<div class="pop"><b>${bk.name || "(ไม่มีชื่อ)"}</b>
          <div class="m">${bk.type || "-"} · ${bk.status || "ไม่มีสถานะ"}<br>
          ${bk.tour_date || ""} ⏰ ${bk.pickup_time || "-"}<br>
          รับที่: ${bk.pickup_location || "-"}<br>
          คนขับ: ${bk.driver || "ยังไม่มี"} · พิกัด: ${bk.precision || "-"}
          ${contactHtml("ลูกค้า", bk.customer_phone)}${contactHtml("คนขับ", bk.driver_phone)}
          ${isPartner ? '<br>🤝 partner-operated — no GPS expected' : ''}</div></div>`;
        if (bmarkers.has(bk.booking_id)) {
          const m = bmarkers.get(bk.booking_id);
          m.setLatLng([bk.lat, bk.lng]);
          m.setIcon(L.divIcon({ className: "", html: pinHtml,
            iconSize: [14, 14], iconAnchor: [7, 7] }));
          m.getPopup().setContent(html);
        } else {
          const m = L.marker([bk.lat, bk.lng], { icon: L.divIcon({ className: "", html: pinHtml,
            iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(map).bindPopup(html);
          bmarkers.set(bk.booking_id, m);
        }
      }
      for (const [bid, m] of bmarkers) {
        if (!bseen.has(bid)) { map.removeLayer(m); bmarkers.delete(bid); }
      }
      const ncBox = document.getElementById("nocoords");
      const ncList = document.getElementById("nclist");
      if (nc.length) {
        ncBox.style.display = "block";
        ncList.innerHTML = nc.map(bk =>
          `<div class="row">${bk.name || "(ไม่มีชื่อ)"}
           <div class="m">${bk.tour_date || ""} ⏰ ${bk.pickup_time || "-"} · ${bk.status || "-"}<br>
           ${bk.pickup_location || "(ไม่มีที่รับ)"}</div></div>`).join("");
      } else {
        ncBox.style.display = "none";
      }

      document.getElementById("count").textContent =
        d.drivers.length + " คนขับ · " + (d.bookings || []).length + " งานวันนี้/พรุ่งนี้";
      document.getElementById("stamp").textContent =
        "อัปเดต " + new Date().toLocaleTimeString("th-TH") + " · รีเฟรชทุก 30 วิ";
    } catch (e) {
      document.getElementById("count").textContent = "⚠ โหลดไม่สำเร็จ";
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
