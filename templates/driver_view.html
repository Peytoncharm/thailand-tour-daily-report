<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#xe15;&#xe34;&#xe14;&#xe15;&#xe32;&#xe21;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07;&#xe04;&#xe19;&#xe02;&#xe31;&#xe1a;</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; }
  .header {
    background: white;
    padding: 12px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-left h2 { font-size: 15px; color: #333; }
  .header-left .info { font-size: 12px; color: #888; margin-top: 2px; }
  .badge {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.active { background: #e8f5e9; color: #2e7d32; }
  .badge.waiting { background: #fff3e0; color: #e65100; }
  .badge.stopped { background: #eeeeee; color: #616161; }
  #map { width: 100%; height: calc(100vh - 60px); }
  .overlay {
    position: absolute;
    top: 80px; left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 20px 28px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    text-align: center;
    z-index: 1000;
    font-size: 15px;
    color: #555;
  }
  .overlay .icon { font-size: 36px; margin-bottom: 8px; }
  .update-time {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 12px;
    color: #666;
    z-index: 1000;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .stale-warning {
    position: absolute;
    top: 70px; left: 50%;
    transform: translateX(-50%);
    background: #fff3e0;
    border: 1px solid #ffcc80;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 13px;
    color: #e65100;
    z-index: 1000;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h2>&#x1F4CD; &#xe15;&#xe34;&#xe14;&#xe15;&#xe32;&#xe21;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07;&#xe04;&#xe19;&#xe02;&#xe31;&#xe1a; &#x2014; <span id="headerName">{{ customer_name or 'Driver' }}</span></h2>
    <div class="info" id="headerInfo"></div>
  </div>
  <div class="badge waiting" id="statusBadge">Waiting...</div>
</div>

<div id="map"></div>

<div class="overlay" id="waitingOverlay">
  <div class="icon">&#x23F3;</div>
  <div>&#xe23;&#xe2d;&#xe04;&#xe19;&#xe02;&#xe31;&#xe1a;&#xe40;&#xe1b;&#xe34;&#xe14;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07;...</div>
</div>

<div class="stale-warning" id="staleWarning">
  &#x26A0;&#xFE0F; &#xe44;&#xe21;&#xe48;&#xe44;&#xe14;&#xe49;&#xe23;&#xe31;&#xe1a;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07;&#xe21;&#xe32;&#xe01;&#xe01;&#xe27;&#xe48;&#xe32; 5 &#xe19;&#xe32;&#xe17;&#xe35;
</div>

<div class="update-time" id="updateTime" style="display:none"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var BOOKING_ID = "{{ booking_id }}";
var DATA_URL = "/track/" + BOOKING_ID + "/data";
var POLL_INTERVAL_MS = 15000; // 15 seconds
var map, marker, trailLine, firstLoad = true;
var lastUpdateTime = null;

// Header info
(function() {
  var time = "{{ pickup_time }}";
  if (time) document.getElementById('headerInfo').textContent = "Pickup: " + time;
})();

// Init map — centered on Koh Chang area
map = L.map('map').setView([12.08, 102.30], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 19
}).addTo(map);

var driverIcon = L.divIcon({
  html: '<div style="font-size:32px">&#x1F697;</div>',
  iconSize: [32, 32],
  iconAnchor: [16, 16],
  className: ''
});

function poll() {
  fetch(DATA_URL)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var badge = document.getElementById('statusBadge');
      var overlay = document.getElementById('waitingOverlay');
      var timeEl = document.getElementById('updateTime');
      var staleEl = document.getElementById('staleWarning');

      if (data.status === 'waiting') {
        badge.className = 'badge waiting';
        badge.textContent = 'Waiting...';
        overlay.style.display = 'block';
        staleEl.style.display = 'none';
        return;
      }

      overlay.style.display = 'none';

      if (data.active) {
        badge.className = 'badge active';
        badge.textContent = 'Live';
      } else {
        badge.className = 'badge stopped';
        badge.textContent = 'Stopped';
      }

      if (data.lat && data.lng) {
        var lat = data.lat;
        var lng = data.lng;

        if (!marker) {
          marker = L.marker([lat, lng], {icon: driverIcon}).addTo(map);
          map.setView([lat, lng], 16);
        } else {
          marker.setLatLng([lat, lng]);
          if (firstLoad) { map.setView([lat, lng], 16); firstLoad = false; }
        }

        // App-source trail (background tracker)
        if (data.trail && data.trail.length > 1) {
          if (trailLine) { trailLine.setLatLngs(data.trail); }
          else { trailLine = L.polyline(data.trail, {color: '#1565c0', weight: 3, opacity: 0.7}).addTo(map); }
        }

        if (data.updated_at) {
          lastUpdateTime = new Date(data.updated_at);
          var t = data.updated_at.split('T')[1] || data.updated_at;
          timeEl.textContent = 'Updated: ' + t;
          timeEl.style.display = 'block';

          // Stale warning if no update for 5+ minutes
          var now = new Date();
          var diffMs = now - lastUpdateTime;
          if (diffMs > 300000) {
            staleEl.style.display = 'block';
          } else {
            staleEl.style.display = 'none';
          }
        }
      }
    })
    .catch(function(e) { console.error('Poll error:', e); });
}

poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
