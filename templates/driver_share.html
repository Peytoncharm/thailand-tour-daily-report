<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>แชร์ตำแหน่ง</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .booking-bar {
    background: white;
    padding: 16px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    text-align: center;
  }
  .booking-bar .label { font-size: 13px; color: #999; margin-bottom: 4px; }
  .booking-bar .info { font-size: 18px; color: #333; font-weight: 600; line-height: 1.5; }
  .booking-bar .sub { font-size: 15px; color: #666; margin-top: 2px; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  /* Pulse animation for active sharing */
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }

  .pulse-dot {
    display: inline-block;
    width: 18px; height: 18px;
    background: #4CAF50;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  .status-msg {
    font-size: 22px;
    color: #333;
    font-weight: 600;
    margin-bottom: 32px;
  }
  .status-sub {
    font-size: 16px;
    color: #888;
    margin-top: 12px;
  }

  .btn-main {
    width: 85vw;
    max-width: 400px;
    height: 30vh;
    min-height: 160px;
    max-height: 260px;
    border: none;
    border-radius: 24px;
    font-size: 36px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-main:active { transform: scale(0.97); }

  .btn-start {
    background: #4CAF50;
    color: white;
  }
  .btn-stop {
    background: #e53935;
    color: white;
  }
  .btn-disabled {
    background: #bdbdbd;
    color: white;
    pointer-events: none;
  }

  .update-time {
    font-size: 14px;
    color: #aaa;
    margin-top: 16px;
  }

  /* Loading spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #e0e0e0; border-top-color: #4CAF50;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }

  .error-icon { font-size: 64px; margin-bottom: 16px; }
  .error-msg { font-size: 20px; color: #e53935; font-weight: 600; margin-bottom: 8px; }
  .error-detail { font-size: 16px; color: #888; }
</style>
</head>
<body>

<div class="booking-bar">
  <div class="info" id="customerName"></div>
  <div class="sub" id="bookingDetail"></div>
</div>

<div class="main">

  <!-- State: Loading GPS -->
  <div id="stateLoading">
    <div class="spinner"></div>
    <div class="status-msg">กำลังขอตำแหน่ง GPS...</div>
    <div class="status-sub">กรุณาอนุญาตการเข้าถึงตำแหน่ง</div>
  </div>

  <!-- State: Ready (before first fix) — auto-starts, but show button as fallback -->
  <div id="stateReady" style="display:none">
    <button class="btn-main btn-start" id="btnStart" onclick="startSharing()">
      เริ่มแชร์ตำแหน่ง 📍
    </button>
  </div>

  <!-- State: Active sharing -->
  <div id="stateActive" style="display:none">
    <div class="status-msg">
      <span class="pulse-dot"></span>กำลังแชร์ตำแหน่ง...
    </div>
    <button class="btn-main btn-stop" id="btnStop" onclick="stopSharing()">
      หยุดแชร์ ✋
    </button>
    <div class="update-time" id="lastUpdate"></div>
  </div>

  <!-- State: Stopped -->
  <div id="stateStopped" style="display:none">
    <div class="status-msg">✅ หยุดแชร์แล้ว</div>
    <div class="status-sub">คุณสามารถปิดหน้านี้ได้</div>
  </div>

  <!-- State: Error -->
  <div id="stateError" style="display:none">
    <div class="error-icon">❌</div>
    <div class="error-msg" id="errorText"></div>
    <div class="error-detail" id="errorDetail"></div>
    <div style="margin-top: 32px;">
      <button class="btn-main btn-start" style="height:auto;min-height:80px;font-size:24px;" onclick="location.reload()">
        ลองใหม่ 🔄
      </button>
    </div>
  </div>

</div>

<script>
var UUID = "{{ uuid }}";
var UPDATE_URL = "/driver/track/" + UUID + "/update";
var STOP_URL = "/driver/track/" + UUID + "/stop";
var watchId, updateInterval;
var sharing = false;
var lastLat, lastLng;

// Booking info
(function() {
  var nameEl = document.getElementById('customerName');
  var detailEl = document.getElementById('bookingDetail');
  var name = "{{ name }}";
  var pickup = "{{ pickup }}";
  var time = "{{ time }}";
  nameEl.textContent = name ? "🚐 " + name : "🚐 Transfer";
  var details = [];
  if (pickup) details.push("📍 " + pickup);
  if (time) details.push("⏰ " + time);
  detailEl.textContent = details.join("  |  ") || "";
})();

function showState(id) {
  ['stateLoading','stateReady','stateActive','stateStopped','stateError'].forEach(function(s) {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function sendUpdate(lat, lng, accuracy) {
  fetch(UPDATE_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({lat: lat, lng: lng, accuracy: accuracy})
  }).then(function(r) { return r.json(); }).then(function(j) {
    if (j.updated_at) {
      var t = j.updated_at.split('T')[1];
      if (t) document.getElementById('lastUpdate').textContent = "อัพเดทล่าสุด: " + t.substring(0, 8);
    }
  }).catch(function(e) {
    console.error('Update failed:', e);
  });
}

function onPosition(pos) {
  lastLat = pos.coords.latitude;
  lastLng = pos.coords.longitude;
  var acc = pos.coords.accuracy;

  if (!sharing) {
    sharing = true;
  }
  showState('stateActive');
  sendUpdate(lastLat, lastLng, acc);
}

function onError(err) {
  var msg = 'GPS ผิดพลาด';
  var detail = 'กรุณาลองใหม่';
  if (err.code === 1) { msg = 'GPS ถูกปฏิเสธ'; detail = 'กรุณาอนุญาตการเข้าถึงตำแหน่งในการตั้งค่าเบราว์เซอร์'; }
  if (err.code === 2) { msg = 'GPS ไม่พร้อมใช้งาน'; detail = 'กรุณาลองใหม่ในที่โล่ง'; }
  if (err.code === 3) { msg = 'GPS timeout'; detail = 'กรุณาลองใหม่'; }
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorDetail').textContent = detail;
  showState('stateError');
}

function startSharing() {
  showState('stateLoading');
  initGPS();
}

function stopSharing() {
  sharing = false;
  if (watchId) navigator.geolocation.clearWatch(watchId);
  if (updateInterval) clearInterval(updateInterval);
  fetch(STOP_URL, {method: 'POST'});
  showState('stateStopped');
}

function initGPS() {
  if (!navigator.geolocation) {
    document.getElementById('errorText').textContent = 'เบราว์เซอร์ไม่รองรับ GPS';
    document.getElementById('errorDetail').textContent = 'กรุณาใช้ Chrome หรือ Safari';
    showState('stateError');
    return;
  }
  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 0
  });
  updateInterval = setInterval(function() {
    if (!sharing || !lastLat) return;
    sendUpdate(lastLat, lastLng, null);
  }, 60000);
}

// Auto-start GPS on page load
initGPS();
</script>
</body>
</html>
