<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>แชร์ตำแหน่ง</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .driver-only-bar {
    background: #1565c0;
    color: white;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
  }

  .booking-bar {
    background: white;
    padding: 16px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    text-align: center;
  }
  .booking-bar .info { font-size: 18px; color: #333; font-weight: 600; line-height: 1.5; }
  .booking-bar .sub { font-size: 15px; color: #666; margin-top: 2px; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }

  .pulse-dot {
    display: inline-block;
    width: 18px; height: 18px;
    background: #4CAF50;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  .status-msg {
    font-size: 22px;
    color: #333;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .status-sub {
    font-size: 16px;
    color: #888;
    margin-top: 12px;
  }

  .warning-box {
    background: #fff3e0;
    border: 1px solid #ffcc80;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 15px;
    color: #e65100;
    max-width: 400px;
  }

  .btn-main {
    width: 85vw;
    max-width: 400px;
    height: 30vh;
    min-height: 160px;
    max-height: 260px;
    border: none;
    border-radius: 24px;
    font-size: 36px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-main:active { transform: scale(0.97); }
  .btn-start { background: #4CAF50; color: white; }
  .btn-stop { background: #e53935; color: white; }

  .update-time {
    font-size: 14px;
    color: #aaa;
    margin-top: 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #e0e0e0; border-top-color: #4CAF50;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }

  .error-icon { font-size: 64px; margin-bottom: 16px; }
  .error-msg { font-size: 20px; color: #e53935; font-weight: 600; margin-bottom: 8px; }
  .error-detail { font-size: 16px; color: #888; }
</style>
</head>
<body>

<div class="driver-only-bar">
  &#x1F6D1; &#xe2b;&#xe19;&#xe49;&#xe32;&#xe19;&#xe35;&#xe49;&#xe2a;&#xe33;&#xe2b;&#xe23;&#xe31;&#xe1a;&#xe04;&#xe19;&#xe02;&#xe31;&#xe1a;&#xe40;&#xe17;&#xe48;&#xe32;&#xe19;&#xe31;&#xe49;&#xe19;
</div>

<div class="booking-bar">
  <div class="info" id="customerName"></div>
  <div class="sub" id="bookingDetail"></div>
</div>

<div class="main">

  <!-- State: Loading GPS -->
  <div id="stateLoading" style="display:none">
    <div class="spinner"></div>
    <div class="status-msg">&#xe01;&#xe33;&#xe25;&#xe31;&#xe07;&#xe02;&#xe2d;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07; GPS...</div>
    <div class="status-sub">&#xe01;&#xe23;&#xe38;&#xe13;&#xe32;&#xe2d;&#xe19;&#xe38;&#xe0d;&#xe32;&#xe15;&#xe01;&#xe32;&#xe23;&#xe40;&#xe02;&#xe49;&#xe32;&#xe16;&#xe36;&#xe07;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07;</div>
  </div>

  <!-- State: Ready — big start button -->
  <div id="stateReady">
    <div class="warning-box">
      &#x26A0;&#xFE0F; &#xe2d;&#xe22;&#xe48;&#xe32;&#xe1b;&#xe34;&#xe14; browser &#xe23;&#xe30;&#xe2b;&#xe27;&#xe48;&#xe32;&#xe07;&#xe40;&#xe14;&#xe34;&#xe19;&#xe17;&#xe32;&#xe07; &#x2014; &#xe01;&#xe32;&#xe23;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe08;&#xe30;&#xe2b;&#xe22;&#xe38;&#xe14;&#xe2d;&#xe31;&#xe15;&#xe42;&#xe19;&#xe21;&#xe31;&#xe15;&#xe34;&#xe43;&#xe19; 8 &#xe0a;&#xe31;&#xe48;&#xe27;&#xe42;&#xe21;&#xe07;
    </div>
    <button class="btn-main btn-start" onclick="startSharing()">
      &#xe40;&#xe23;&#xe34;&#xe48;&#xe21;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07; &#x1F4CD;
    </button>
  </div>

  <!-- State: Active sharing -->
  <div id="stateActive" style="display:none">
    <div class="status-msg">
      <span class="pulse-dot"></span>&#xe01;&#xe33;&#xe25;&#xe31;&#xe07;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe15;&#xe33;&#xe41;&#xe2b;&#xe19;&#xe48;&#xe07;...
    </div>
    <div class="warning-box">
      &#x26A0;&#xFE0F; &#xe2d;&#xe22;&#xe48;&#xe32;&#xe1b;&#xe34;&#xe14; browser &#xe23;&#xe30;&#xe2b;&#xe27;&#xe48;&#xe32;&#xe07;&#xe40;&#xe14;&#xe34;&#xe19;&#xe17;&#xe32;&#xe07;
    </div>
    <button class="btn-main btn-stop" onclick="stopSharing()">
      &#xe2b;&#xe22;&#xe38;&#xe14;&#xe41;&#xe0a;&#xe23;&#xe4c; &#x270B;
    </button>
    <div class="update-time" id="lastUpdate"></div>
  </div>

  <!-- State: Stopped -->
  <div id="stateStopped" style="display:none">
    <div class="status-msg">&#x2705; &#xe2b;&#xe22;&#xe38;&#xe14;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe41;&#xe25;&#xe49;&#xe27;</div>
    <div class="status-sub" style="margin-bottom:24px">&#xe2b;&#xe32;&#xe01;&#xe15;&#xe49;&#xe2d;&#xe07;&#xe01;&#xe32;&#xe23;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe2d;&#xe35;&#xe01;&#xe04;&#xe23;&#xe31;&#xe49;&#xe07; &#xe01;&#xe14;&#xe1b;&#xe38;&#xe48;&#xe21;&#xe14;&#xe49;&#xe32;&#xe19;&#xe25;&#xe48;&#xe32;&#xe07;</div>
    <button class="btn-main btn-start" style="height:auto;min-height:100px;font-size:28px;" onclick="resumeSharing()">
      &#xe40;&#xe23;&#xe34;&#xe48;&#xe21;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe2d;&#xe35;&#xe01;&#xe04;&#xe23;&#xe31;&#xe49;&#xe07; &#x1F4CD;
    </button>
  </div>

  <!-- State: Expired (8hr auto-stop) -->
  <div id="stateExpired" style="display:none">
    <div class="status-msg">&#x2705; &#xe01;&#xe32;&#xe23;&#xe41;&#xe0a;&#xe23;&#xe4c;&#xe2a;&#xe34;&#xe49;&#xe19;&#xe2a;&#xe38;&#xe14;</div>
    <div class="status-sub">&#xe04;&#xe38;&#xe13;&#xe2a;&#xe32;&#xe21;&#xe32;&#xe23;&#xe16;&#xe1b;&#xe34;&#xe14;&#xe2b;&#xe19;&#xe49;&#xe32;&#xe19;&#xe35;&#xe49;&#xe44;&#xe14;&#xe49;</div>
  </div>

  <!-- State: Error -->
  <div id="stateError" style="display:none">
    <div class="error-icon">&#x274C;</div>
    <div class="error-msg" id="errorText"></div>
    <div class="error-detail" id="errorDetail"></div>
    <div style="margin-top: 32px;">
      <button class="btn-main btn-start" style="height:auto;min-height:80px;font-size:24px;" onclick="location.reload()">
        &#xe25;&#xe2d;&#xe07;&#xe43;&#xe2b;&#xe21;&#xe48; &#x1F504;
      </button>
    </div>
  </div>

</div>

<script>
var BOOKING_ID = "{{ booking_id }}";
var PING_URL = "/driver/track/" + BOOKING_ID + "/ping";
var STOP_URL = "/driver/track/" + BOOKING_ID + "/stop";

var MAX_DURATION_MS = 8 * 60 * 60 * 1000; // 8 hours
var PING_INTERVAL_MS = 30000; // 30 seconds

var watchId, pingTimer, autoStopTimer;
var sharing = false;
var startedAt = null;
var lastLat, lastLng;

// Booking info
(function() {
  var nameEl = document.getElementById('customerName');
  var detailEl = document.getElementById('bookingDetail');
  var name = "{{ customer_name }}";
  var time = "{{ pickup_time }}";
  nameEl.textContent = name ? "\uD83D\uDE90 " + name : "\uD83D\uDE90 Transfer";
  if (time) detailEl.textContent = "\u23F0 " + time;
})();

function showState(id) {
  ['stateLoading','stateReady','stateActive','stateStopped','stateExpired','stateError'].forEach(function(s) {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function sendPing(lat, lng, accuracy) {
  fetch(PING_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({lat: lat, lng: lng, accuracy: accuracy})
  }).then(function(r) { return r.json(); }).then(function(j) {
    if (j.updated_at) {
      var t = j.updated_at.split('T')[1];
      if (t) document.getElementById('lastUpdate').textContent =
        "\u0E2D\u0E31\u0E1E\u0E40\u0E14\u0E17\u0E25\u0E48\u0E32\u0E2A\u0E38\u0E14: " + t.substring(0, 8);
    }
  }).catch(function(e) {
    console.error('Ping failed:', e);
  });
}

function onPosition(pos) {
  lastLat = pos.coords.latitude;
  lastLng = pos.coords.longitude;
  var acc = pos.coords.accuracy;

  if (!sharing) {
    sharing = true;
    startedAt = Date.now();
    // Auto-stop after 8 hours
    autoStopTimer = setTimeout(function() {
      doStop();
      showState('stateExpired');
    }, MAX_DURATION_MS);
  }
  showState('stateActive');
  sendPing(lastLat, lastLng, acc);
}

function onError(err) {
  var msg = 'GPS \u0E1C\u0E34\u0E14\u0E1E\u0E25\u0E32\u0E14';
  var detail = '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E25\u0E2D\u0E07\u0E43\u0E2B\u0E21\u0E48';
  if (err.code === 1) { msg = 'GPS \u0E16\u0E39\u0E01\u0E1B\u0E0F\u0E34\u0E40\u0E2A\u0E18'; detail = '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E2D\u0E19\u0E38\u0E0D\u0E32\u0E15\u0E01\u0E32\u0E23\u0E40\u0E02\u0E49\u0E32\u0E16\u0E36\u0E07\u0E15\u0E33\u0E41\u0E2B\u0E19\u0E48\u0E07\u0E43\u0E19\u0E01\u0E32\u0E23\u0E15\u0E31\u0E49\u0E07\u0E04\u0E48\u0E32\u0E40\u0E1A\u0E23\u0E32\u0E27\u0E4C\u0E40\u0E0B\u0E2D\u0E23\u0E4C'; }
  if (err.code === 2) { msg = 'GPS \u0E44\u0E21\u0E48\u0E1E\u0E23\u0E49\u0E2D\u0E21\u0E43\u0E0A\u0E49\u0E07\u0E32\u0E19'; detail = '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E25\u0E2D\u0E07\u0E43\u0E2B\u0E21\u0E48\u0E43\u0E19\u0E17\u0E35\u0E48\u0E42\u0E25\u0E48\u0E07'; }
  if (err.code === 3) { msg = 'GPS timeout'; detail = '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E25\u0E2D\u0E07\u0E43\u0E2B\u0E21\u0E48'; }
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorDetail').textContent = detail;
  showState('stateError');
}

function startSharing() {
  showState('stateLoading');
  if (!navigator.geolocation) {
    document.getElementById('errorText').textContent = '\u0E40\u0E1A\u0E23\u0E32\u0E27\u0E4C\u0E40\u0E0B\u0E2D\u0E23\u0E4C\u0E44\u0E21\u0E48\u0E23\u0E2D\u0E07\u0E23\u0E31\u0E1A GPS';
    document.getElementById('errorDetail').textContent = '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E43\u0E0A\u0E49 Chrome \u0E2B\u0E23\u0E37\u0E2D Safari';
    showState('stateError');
    return;
  }
  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 0
  });
  // Periodic ping even if position doesn't change
  pingTimer = setInterval(function() {
    if (!sharing || !lastLat) return;
    sendPing(lastLat, lastLng, null);
  }, PING_INTERVAL_MS);
}

function stopSharing() {
  if (!confirm('\u0E2B\u0E22\u0E38\u0E14\u0E41\u0E0A\u0E23\u0E4C\u0E15\u0E33\u0E41\u0E2B\u0E19\u0E48\u0E07\u0E43\u0E0A\u0E48\u0E2B\u0E23\u0E37\u0E2D\u0E44\u0E21\u0E48?')) return;
  doStop();
  showState('stateStopped');
}

function doStop() {
  sharing = false;
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
  if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
  fetch(STOP_URL, {method: 'POST'});
}

function resumeSharing() {
  // Re-activate on backend by sending a fresh ping once GPS starts
  startSharing();
}
</script>
</body>
</html>
