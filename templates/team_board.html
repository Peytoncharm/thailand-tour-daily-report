<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>P&amp;C Transfer — {% if demo %}DEMO {% endif %}Job Board</title>
<style>
  :root {
    --bg:#0b0d12; --panel:#101320; --panel2:#0d0f16; --line:#1d2233;
    --text:#e6e8ef; --muted:#98a0b8;
    --green:#2dd4a0; --amber:#f0b429; --red:#f06060; --grey:#5a6072;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg,#101320,rgba(11,13,18,.94));
    border-bottom:1px solid var(--line); padding:12px 16px;
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  .demo-badge { background:var(--amber); color:#0b0d12; font-weight:700;
    border-radius:6px; padding:2px 10px; font-size:12px; }
  a.navlink { color:#4da3ff; font-size:12px; text-decoration:none; }
  main { padding:12px; max-width:1100px; margin:0 auto; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%;
    vertical-align:middle; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:12px;
    padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer;
    white-space:nowrap; user-select:none; }
  th .arrow { opacity:.6; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.attn { background:rgba(240,96,96,.08); }
  tr.attn td:first-child { border-left:3px solid var(--red); }
  .m { color:var(--muted); font-size:11px; }
  .pill { border:1px solid var(--line); border-radius:8px; padding:1px 8px;
    font-size:11px; color:var(--muted); white-space:nowrap; }
  .pill.ok { color:var(--green); border-color:#1e4d3e; }
  #summary { margin:10px 0 14px; display:flex; gap:8px; flex-wrap:wrap; }
  .sumbox { background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:8px 14px; font-size:12px; color:var(--muted); }
  .sumbox b { color:var(--text); font-size:16px; display:block; }
  /* Mobile: table -> stacked cards */
  @media (max-width:640px) {
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tr { background:var(--panel2); border:1px solid var(--line);
      border-radius:10px; margin-bottom:10px; padding:6px 4px; }
    tr.attn { border-left:3px solid var(--red); }
    td { border:none; padding:4px 10px; }
    td::before { content:attr(data-l); color:var(--muted); font-size:11px;
      display:inline-block; min-width:84px; }
  }
</style>
</head>
<body>
<header>
  <h1>📋 P&amp;C Transfer — {% if demo %}DEMO {% endif %}Job Board</h1>
  <span class="sub" id="count">…</span>
  {% if demo %}<span class="demo-badge">DEMO — ข้อมูลจำลอง ไม่ใช่ข้อมูลจริง</span>{% endif %}
  <a class="navlink" id="maplink" href="#">🗺 แผนที่</a>
  <span class="sub" id="stamp"></span>
</header>
<main>
  <div id="summary"></div>
  <table>
    <thead><tr>
      <th data-k="pickup">เวลารับ <span class="arrow">↕</span></th>
      <th data-k="name">ลูกค้า <span class="arrow">↕</span></th>
      <th data-k="route">เส้นทาง</th>
      <th data-k="type">ประเภท <span class="arrow">↕</span></th>
      <th data-k="status">สถานะ <span class="arrow">↕</span></th>
      <th data-k="driver">คนขับ <span class="arrow">↕</span></th>
      <th data-k="signal">สัญญาณ</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  const KEY = {{ key|tojson }};
  const DEMO = {{ 'true' if demo else 'false' }};
  document.getElementById("maplink").href =
    "/team/dashboard?key=" + encodeURIComponent(KEY) + (DEMO ? "&demo=1" : "");

  let bookings = [], driverAge = {}, thresholds = {green_s:300, amber_s:1200};
  let sortKey = "pickup", sortAsc = true;

  // Zoho deep links (live records only — demo rows stay plain text:
  // a dead link is more honest than a broken one)
  const ZOHO = "https://crm.zoho.eu/crm/org20081593579/tab";
  function zlink(url, text) {
    return `<a href="${url}" target="_blank" rel="noopener"
      style="color:inherit;text-decoration:underline dotted #4da3ff;text-underline-offset:3px">${text}</a>`;
  }
  function customerCell(bk) {
    const nm = bk.name || "(ไม่มีชื่อ)";
    if (DEMO || !bk.booking_id || String(bk.booking_id).startsWith("DEMO")) return nm;
    return zlink(`${ZOHO}/Koh_Chang_Orders/${bk.booking_id}`, nm);
  }
  function driverCell(bk) {
    if (!bk.driver) return '<span class="m">ยังไม่มี ⚠</span>';
    if (DEMO || !bk.provider_id) return bk.driver;
    return zlink(`${ZOHO}/Providers/${bk.provider_id}`, bk.driver);
  }

  function signal(bk) {
    if (!bk.driver) return {c:"var(--grey)", label:"ไม่มีคนขับ", rank:3};
    if (!(bk.driver in driverAge)) return {c:"var(--grey)", label:"ไม่เคยส่งสัญญาณ", rank:2};
    const a = driverAge[bk.driver];
    if (a == null) return {c:"var(--grey)", label:"เงียบ (พักงาน)", rank:1};
    if (a < thresholds.green_s) return {c:"var(--green)", label:"สด", rank:0};
    if (a < thresholds.amber_s) return {c:"var(--amber)", label:Math.round(a/60)+" นาที", rank:1};
    return {c:"var(--red)", label:Math.round(a/60)+" นาทีแล้ว", rank:2};
  }
  function attention(bk) {
    const s = signal(bk);
    return !bk.driver || s.c === "var(--red)" || bk.lat == null;
  }
  function sortVal(bk) {
    switch (sortKey) {
      case "pickup": return (bk.tour_date||"") + " " + (bk.pickup_time||"99:99");
      case "name":   return bk.name||"";
      case "type":   return bk.type||"";
      case "status": return bk.status||"";
      case "driver": return bk.driver||"zzz";
      default:       return "";
    }
  }
  function render() {
    const rows = document.getElementById("rows");
    const list = [...bookings].sort((a,b) => {
      const at = attention(a)?0:1, bt = attention(b)?0:1;
      if (at !== bt) return at-bt;                       // attention first
      const va = sortVal(a), vb = sortVal(b);
      return (va<vb?-1:va>vb?1:0) * (sortAsc?1:-1);
    });
    rows.innerHTML = list.map(bk => {
      const s = signal(bk);
      const noCoords = bk.lat == null;
      return `<tr class="${attention(bk)?'attn':''}">
        <td data-l="เวลารับ"><b>${bk.pickup_time||"–"}</b>
          <div class="m">${bk.tour_date||""}</div></td>
        <td data-l="ลูกค้า">${customerCell(bk)}</td>
        <td data-l="เส้นทาง">${bk.pickup_location||"–"} → ${bk.dropoff_location||"–"}
          ${noCoords ? '<div class="m">⚠ ไม่มีพิกัด</div>' : ''}</td>
        <td data-l="ประเภท">${bk.type||"–"}</td>
        <td data-l="สถานะ"><span class="pill ${ (bk.status||'').toLowerCase()==='confirmed'?'ok':'' }">${bk.status||"ไม่มีสถานะ"}</span></td>
        <td data-l="คนขับ">${driverCell(bk)}</td>
        <td data-l="สัญญาณ"><span class="dot" style="background:${s.c}"></span>
          <span class="m">${s.label}</span></td>
      </tr>`;
    }).join("");
    const n = bookings.length;
    const attn = bookings.filter(attention).length;
    const noC = bookings.filter(b => b.lat == null).length;
    const noD = bookings.filter(b => !b.driver).length;
    document.getElementById("count").textContent = n + " งานวันนี้/พรุ่งนี้";
    document.getElementById("summary").innerHTML =
      `<div class="sumbox"><b>${n}</b>งานทั้งหมด</div>` +
      `<div class="sumbox"><b style="color:var(--red)">${attn}</b>ต้องดู ⚠</div>` +
      `<div class="sumbox"><b>${noD}</b>ยังไม่มีคนขับ</div>` +
      `<div class="sumbox"><b>${noC}</b>ไม่มีพิกัด</div>`;
  }
  document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (k === "route" || k === "signal") return;
    if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
    render();
  }));
  async function refresh() {
    try {
      const r = await fetch("/team/dashboard/data?key=" + encodeURIComponent(KEY)
                            + (DEMO ? "&demo=1" : ""));
      const d = await r.json();
      if (!d.ok) { document.getElementById("count").textContent = "⚠ " + (d.reason||"error"); return; }
      thresholds = d.thresholds || thresholds;
      driverAge = {};
      for (const drv of (d.drivers||[])) driverAge[drv.code] = drv.age_s;
      bookings = d.bookings || [];
      render();
      document.getElementById("stamp").textContent =
        "อัปเดต " + new Date().toLocaleTimeString("th-TH");
    } catch (e) {
      document.getElementById("count").textContent = "⚠ โหลดไม่สำเร็จ";
    }
  }
  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
